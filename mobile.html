<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>身份确认 - AI申通·AI安全</title>
  <style>
    :root {
      --bg-primary: #050816;
      --bg-glass: rgba(10, 18, 50, 0.65);
      --accent-cyan: #00e5ff;
      --accent-blue: #2979ff;
      --accent-purple: #9c27b0;
      --text-primary: #e8ecf1;
      --text-secondary: #7a86a1;
      --border-color: rgba(0, 229, 255, 0.2);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background Animation */
    .bg-animation {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 20s ease-in-out infinite;
      opacity: 0.6;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0,229,255,0.2), transparent 70%);
      top: -10%;
      left: -20%;
      animation-duration: 25s;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(41,121,255,0.2), transparent 70%);
      bottom: 10%;
      right: -10%;
      animation-duration: 20s;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
    }

    /* Container */
    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 400px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      transform: translateY(20px);
      opacity: 0;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00e5ff, #2979ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 1px;
    }

    /* Segmented Control */
    .role-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 32px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .role-btn {
      flex: 1;
      padding: 12px 0;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      z-index: 1;
    }

    .role-btn.active {
      color: #fff;
    }

    .selector-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: calc(50% - 4px);
      background: linear-gradient(135deg, rgba(0,229,255,0.2), rgba(41,121,255,0.2));
      border: 1px solid rgba(0,229,255,0.4);
      border-radius: 8px;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 0;
      box-shadow: 0 0 15px rgba(0,229,255,0.15);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .form-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: #fff;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .form-input:focus {
      border-color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
    }

    .team-feedback {
      font-size: 13px;
      margin-top: 8px;
      padding-left: 4px;
      height: 18px;
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .team-feedback.success { color: #00e676; opacity: 1; }
    .team-feedback.error { color: #ff5252; opacity: 1; }

    /* Dynamic Form Sections */
    #teamForm, #audienceForm {
      display: none;
    }

    #teamForm.active, #audienceForm.active {
      display: block;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      color: #050816;
      margin-top: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .submit-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: skewX(-20deg);
      animation: btnShine 3s infinite;
    }

    @keyframes btnShine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    .submit-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(0, 229, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="bg-animation">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
  </div>

  <div class="container">
    <div class="header">
      <h1 class="title">身份确认</h1>
      <div class="subtitle">AI申通·AI安全 知识竞答</div>
    </div>

    <div class="role-selector">
      <div class="selector-slider" id="selectorSlider"></div>
      <div class="role-btn active" data-role="team" onclick="switchRole('team')">参赛队伍</div>
      <div class="role-btn" data-role="audience" onclick="switchRole('audience')">观众组</div>
    </div>

    <form id="loginForm" onsubmit="handleSubmit(event)">
      
      <!-- 参赛队伍表单 -->
      <div id="teamForm" class="active">
        <div class="form-group" style="animation-delay: 0.1s">
          <label class="form-label">队伍编号</label>
          <input type="text" id="teamId" class="form-input" placeholder="请输入队伍编号" autocomplete="off" maxlength="4" oninput="checkTeam()">
          <div id="teamFeedback" class="team-feedback"></div>
        </div>
      </div>

      <!-- 观众组表单 -->
      <div id="audienceForm">
        <div class="form-group" style="animation-delay: 0.1s">
          <label class="form-label">工号</label>
          <input type="text" id="empId" class="form-input" placeholder="请输入您的工号" autocomplete="off">
        </div>
        <div class="form-group" style="animation-delay: 0.2s">
          <label class="form-label">姓名</label>
          <input type="text" id="empName" class="form-input" placeholder="请输入您的姓名" autocomplete="off">
        </div>
      </div>

      <button type="submit" class="submit-btn" style="animation-delay: 0.3s; opacity: 0; animation: fadeIn 0.4s ease forwards;">确认进入</button>
    </form>
  </div>

  <script>
    const TEAM_MAPPING = {
      "1001": {"region": "安徽", "name": "皖盾卫士"},
      "1002": {"region": "川藏", "name": "食铁兽"},
      "1003": {"region": "东北", "name": "东北安"},
      "1004": {"region": "福建", "name": "闽安速递队"},
      "1005": {"region": "广东", "name": "粤安先锋"},
      "1006": {"region": "广西", "name": "八桂安全队"},
      "1007": {"region": "贵州", "name": "安全黔行队"},
      "1008": {"region": "河南", "name": "豫安先锋队"},
      "1009": {"region": "湖北", "name": "楚安先锋队"},
      "1010": {"region": "湖南", "name": "潇湘护卫队"},
      "1011": {"region": "江苏", "name": "苏锐队"},
      "1012": {"region": "江西", "name": "赣好安全队"},
      "1013": {"region": "京津冀", "name": "燕赵安峰队"},
      "1014": {"region": "内蒙古", "name": "北疆申盾队"},
      "1015": {"region": "山东", "name": "山东泰山队"},
      "1016": {"region": "山西", "name": "晋安队"},
      "1017": {"region": "上海", "name": "沪申小队"},
      "1018": {"region": "西北", "name": "泰安先锋队"},
      "1019": {"region": "云南", "name": "滇峰行者队"},
      "1020": {"region": "浙江", "name": "浙里安全 2.0"},
      "1021": {"region": "重庆", "name": "渝路同行"},
      "2001": {"region": "天津一级分拨", "name": "津卫先锋"},
      "2002": {"region": "广州一级分拨", "name": "破穗先锋队"},
      "2003": {"region": "粤海桂业务区", "name": "粤海桂安全卫士"},
      "2004": {"region": "江苏业务区", "name": "苏安队"},
      "2005": {"region": "上海业务区", "name": "沪安全先锋队"},
      "2006": {"region": "西北业务区", "name": "西北安全护卫队"},
      "2007": {"region": "东北业务区", "name": "东北战狼队"},
      "2008": {"region": "成都一级分拨", "name": "蓉安先锋队"},
      "2009": {"region": "浙江业务区", "name": "浙江安全先锋队"},
      "2010": {"region": "福建业务区", "name": "福建平安先锋队"},
      "2011": {"region": "豫湘业务区", "name": "豫湘铁军队"},
      "2012": {"region": "皖赣业务区", "name": "皖赣护安队"},
      "2013": {"region": "武汉一级分拨", "name": "鄂安突击队"},
      "2014": {"region": "晋鲁蒙业务区", "name": "泰山全安队"},
      "2015": {"region": "京津冀业务区", "name": "京安队"},
      "2016": {"region": "西南业务区", "name": "西南守安团"}
    };

    let currentRole = 'team'; // 'team' or 'audience'

    function checkTeam() {
      const val = document.getElementById('teamId').value.trim();
      const fb = document.getElementById('teamFeedback');
      
      if (val.length === 0) {
        fb.className = 'team-feedback';
        fb.innerText = '';
        return;
      }

      if (TEAM_MAPPING[val]) {
        fb.className = 'team-feedback success';
        fb.innerText = `✓ 匹配成功：【${TEAM_MAPPING[val].region}】${TEAM_MAPPING[val].name}`;
      } else if (val.length >= 4) {
        fb.className = 'team-feedback error';
        fb.innerText = '✗ 编号不存在，请核对后输入';
      } else {
        fb.className = 'team-feedback';
        fb.innerText = '';
      }
    }

    function switchRole(role) {
      if (currentRole === role) return;
      currentRole = role;

      const slider = document.getElementById('selectorSlider');
      const btns = document.querySelectorAll('.role-btn');
      
      if (role === 'team') {
        slider.style.transform = 'translateX(0)';
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
        
        document.getElementById('teamForm').classList.add('active');
        document.getElementById('audienceForm').classList.remove('active');
      } else {
        slider.style.transform = 'translateX(100%)';
        btns[1].classList.add('active');
        btns[0].classList.remove('active');
        
        document.getElementById('teamForm').classList.remove('active');
        document.getElementById('audienceForm').classList.add('active');
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      
      let data = { role: currentRole };
      
      if (currentRole === 'team') {
        const teamId = document.getElementById('teamId').value.trim();
        if (!teamId) {
          alert('请输入队伍编号');
          return;
        }
        if (!TEAM_MAPPING[teamId]) {
          alert('队伍编号不存在，请核对后再试！');
          return;
        }
        data.teamId = teamId;
        data.teamInfo = TEAM_MAPPING[teamId];
      } else {
        const empId = document.getElementById('empId').value.trim();
        const empName = document.getElementById('empName').value.trim();
        if (!empId) {
          alert('请输入工号');
          return;
        }
        if (!empName) {
          alert('请输入姓名');
          return;
        }
        data.empId = empId;
        data.empName = empName;
      }

      console.log('Submitted Data:', data);
      
      // Here you can redirect to the main game page or make an API request
      // window.location.href = `game.html?role=${data.role}&...`;
      
      // Feedback to user
      const btn = document.querySelector('.submit-btn');
      const originalText = btn.innerText;
      btn.innerText = '进入中...';
      btn.style.opacity = '0.8';
      btn.style.pointerEvents = 'none';

      // Simulate a network request
      setTimeout(() => {
        alert('验证成功！即将进入系统（可在此处对接后续跳转逻辑）');
        btn.innerText = originalText;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
      }, 800);
    }
  </script>
</body>
</html>
