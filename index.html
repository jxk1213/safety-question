<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI申通·AI安全 - 安全知识竞答</title>
  <style>
    @property --border-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }
    :root {
      --bg-primary: #050816;
      --bg-secondary: #0c1130;
      --bg-card: rgba(8, 16, 45, 0.7);
      --bg-card-hover: rgba(12, 24, 65, 0.85);
      --bg-glass: rgba(10, 18, 50, 0.55);
      --accent-cyan: #00e5ff;
      --accent-blue: #2979ff;
      --accent-purple: #9c27b0;
      --accent-magenta: #e040fb;
      --text-primary: #e8ecf1;
      --text-secondary: #7a86a1;
      --success: #00e676;
      --danger: #ff5252;
      --warning: #ffab40;
      --border-glow: rgba(0, 229, 255, 0.2);
      --sidebar-width: max(168px, calc(100vw / 6));
      /* 与首页 .team-grid 单列卡片一致：列宽 + 行高（主区留白与首页队伍区相同算法） */
      --team-grid-gap: clamp(8px, 1vw, 14px);
      --home-team-card-width: calc((100vw - var(--sidebar-width) - 64px - 7 * var(--team-grid-gap)) / 8);
      /* 100vh − 主区上下 padding(40) − 标题区(~100) − 首页队伍网格上下 padding(18) − 额外余量以防被底部遮挡 */
      --home-team-card-height: calc(100vh - 180px);
      --glow-cyan: 0 0 20px rgba(0,229,255,0.15), 0 0 60px rgba(0,229,255,0.05);
      --glow-cyan-strong: 0 0 15px rgba(0,229,255,0.3), 0 0 45px rgba(0,229,255,0.1), 0 0 80px rgba(0,229,255,0.05);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* ===== Particle Canvas ===== */
    #particleCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== Background Layers ===== */
    .bg-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none; z-index: 0;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 70%);
    }
    .bg-orbs {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat 25s ease-in-out infinite;
    }
    .bg-orb:nth-child(1) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,229,255,0.12), transparent 70%);
      top: -10%; left: 10%;
      animation-duration: 30s;
    }
    .bg-orb:nth-child(2) {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(156,39,176,0.1), transparent 70%);
      bottom: -15%; right: 15%;
      animation-duration: 22s;
      animation-delay: -8s;
    }
    .bg-orb:nth-child(3) {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(41,121,255,0.1), transparent 70%);
      top: 40%; left: 55%;
      animation-duration: 28s;
      animation-delay: -14s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 40px) scale(0.95); }
      75% { transform: translate(30px, 20px) scale(1.02); }
    }
    .bg-scanline {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bg-scanline::after {
      content: '';
      position: absolute;
      top: -100%; left: 0;
      width: 100%; height: 200%;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 3px,
        rgba(0,229,255,0.012) 3px,
        rgba(0,229,255,0.012) 4px
      );
      animation: scanScroll 8s linear infinite;
    }
    @keyframes scanScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(50%); }
    }
    .scan-beam {
      position: fixed; left: 0; width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.4), rgba(0,229,255,0.8), rgba(0,229,255,0.4), transparent);
      box-shadow: 0 0 30px 10px rgba(0,229,255,0.08);
      z-index: 0; pointer-events: none;
      animation: beamSweep 6s ease-in-out infinite;
    }
    @keyframes beamSweep {
      0% { top: -5%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 105%; opacity: 0; }
    }

    /* ===== Main Area ===== */
    .main-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 28px 20px 36px;
      position: relative;
      z-index: 1;
      /* 横向：斜切省区卡可略越界；纵向：必须为 visible，否则队伍卡 hover 上移 + 大光晕会被裁切 */
      overflow-x: visible;
      overflow-y: visible;
    }
    .main-header {
      text-align: center;
      padding: 10px 0 14px;
      flex-shrink: 0;
      position: relative;
    }
    .main-header h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 12px;
      background: linear-gradient(135deg, #00e5ff 0%, #2979ff 40%, #e040fb 70%, #00e5ff 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: headerShine 4s ease-in-out infinite;
      text-shadow: none;
      position: relative;
    }
    @keyframes headerShine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .main-header .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      letter-spacing: 8px;
      margin-top: 10px;
      text-transform: uppercase;
    }
    .main-header::after,
    .main-header::before {
      display: none;
    }

    /* ===== Glass Card Mixin ===== */
    .glass-card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid rgba(0,229,255,0.1);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.5), transparent);
    }

    /* ===== Animated Border Card ===== */
    .glow-border {
      position: relative;
      overflow: visible;
    }
    .glow-border::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(from var(--border-angle), transparent 40%, var(--accent-cyan) 50%, transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: rotateBorder 4s linear infinite;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .glow-border:hover::after { opacity: 1; }
    @keyframes rotateBorder {
      to { --border-angle: 360deg; }
    }

    /* ===== Corner Brackets ===== */
    .tech-corners {
      position: relative;
    }
    .tech-corners .corner {
      position: absolute;
      width: 16px; height: 16px;
      pointer-events: none;
    }
    .tech-corners .corner::before,
    .tech-corners .corner::after {
      content: '';
      position: absolute;
      background: var(--accent-cyan);
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }
    .tech-corners:hover .corner::before,
    .tech-corners:hover .corner::after {
      opacity: 1;
    }
    .corner.tl { top: -1px; left: -1px; }
    .corner.tr { top: -1px; right: -1px; }
    .corner.bl { bottom: -1px; left: -1px; }
    .corner.br { bottom: -1px; right: -1px; }
    .corner.tl::before, .corner.tr::before { top: 0; height: 2px; width: 100%; }
    .corner.bl::before, .corner.br::before { bottom: 0; height: 2px; width: 100%; }
    .corner.tl::after, .corner.bl::after { left: 0; width: 2px; height: 100%; }
    .corner.tr::after, .corner.br::after { right: 0; width: 2px; height: 100%; }

    /* ===== Pages ===== */
    .page {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: pageIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .page.active { display: flex; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(30px) scale(0.98); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .page-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
      letter-spacing: 4px;
    }
    .page-subtitle {
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 32px;
      letter-spacing: 2px;
    }
    .current-team-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 22px;
      border-radius: 20px;
      border: 1px solid rgba(0,229,255,0.2);
      background: rgba(0,229,255,0.06);
      backdrop-filter: blur(10px);
      font-size: 14px;
      color: var(--accent-cyan);
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,229,255,0.05);
    }
    .current-team-badge .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px currentColor;
    }

    /* ===== Team Selection Page (Slanted Frame Design) ===== */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 14px;
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      padding: 10px 0 20px;
    }
    /* 首页：单行卡片铺满主区域高度与宽度 */
    #pageTeamSelect.page {
      /* 与题型页同理：为 hover translateY + 外发光保留顶部空间，避免被滚动/裁剪上下文切顶 */
      --team-hover-bleed: clamp(56px, 10vmin, 120px);
      justify-content: flex-start;
      align-items: stretch;
      flex: 1;
      min-height: 0;
      width: 100%;
      padding-top: var(--team-hover-bleed);
      box-sizing: border-box;
    }
    #pageTeamSelect .team-grid {
      flex: 1;
      min-height: 0;
      grid-template-rows: 1fr;
      gap: clamp(8px, 1vw, 14px);
      padding: 6px 0 12px;
      align-items: stretch;
      margin-top: calc(-1 * var(--team-hover-bleed));
    }
    #pageTeamSelect .team-card {
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #pageTeamSelect .team-card-frame {
      flex: 1;
      min-height: 0;
      aspect-ratio: unset;
      height: auto;
    }
    #pageTeamSelect .team-card-frame-content {
      padding: clamp(14px, 2.2vmin, 28px) clamp(8px, 1.2vmin, 14px);
    }
    #pageTeamSelect .team-card-abbr {
      font-size: clamp(18px, 2.4vmin, 36px);
    }
    #pageTeamSelect .team-card-subtitle {
      font-size: clamp(10px, 1.35vmin, 15px);
    }
    #pageTeamSelect .team-card-zone--emblem .team-card-logo {
      width: min(80cqmin, 100%);
      height: min(80cqmin, 100%);
      font-size: clamp(16px, 24cqmin, 40px);
    }
    #pageTeamSelect .team-card-zone--flag .team-card-map-container {
      width: min(94cqmin, 100%);
      height: min(94cqmin, 100%);
    }
    #pageTeamSelect .frame-corner {
      width: clamp(12px, 1.4vmin, 16px);
      height: clamp(12px, 1.4vmin, 16px);
    }
    .team-card {
      cursor: pointer;
      position: relative;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .team-card:hover {
      transform: translateY(-12px);
      z-index: 2;
    }

    .team-card-frame {
      width: 100%;
      aspect-ratio: 2/5;
      background: linear-gradient(180deg, rgba(10, 20, 60, 0.6) 0%, rgba(5, 12, 40, 0.8) 100%);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      position: relative;
      overflow: hidden;
      transform: skewX(-3deg);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .team-card-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 4px,
        rgba(0, 229, 255, 0.015) 4px,
        rgba(0, 229, 255, 0.015) 5px
      );
      pointer-events: none;
    }
    .team-card-frame::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.6), transparent);
      pointer-events: none;
    }

    .team-card:hover .team-card-frame {
      border-color: rgba(0, 229, 255, 0.9);
      background: linear-gradient(
        180deg,
        rgba(0, 229, 255, 0.06) 0%,
        rgba(10, 20, 60, 0.9) 25%,
        rgba(10, 20, 60, 0.9) 75%,
        rgba(0, 229, 255, 0.04) 100%
      );
      box-shadow:
        0 0 8px rgba(0, 229, 255, 0.6),
        0 0 20px rgba(0, 229, 255, 0.4),
        0 0 40px rgba(0, 229, 255, 0.2),
        0 0 80px rgba(0, 229, 255, 0.12),
        0 0 120px rgba(0, 229, 255, 0.06),
        inset 0 0 25px rgba(0, 229, 255, 0.12),
        inset 0 0 50px rgba(0, 229, 255, 0.04);
      animation: frameGlow 2s ease-in-out infinite;
    }
    @keyframes frameGlow {
      0%, 100% {
        box-shadow:
          0 0 8px rgba(0,229,255,0.6), 0 0 20px rgba(0,229,255,0.4),
          0 0 40px rgba(0,229,255,0.2), 0 0 80px rgba(0,229,255,0.12),
          0 0 120px rgba(0,229,255,0.06),
          inset 0 0 25px rgba(0,229,255,0.12), inset 0 0 50px rgba(0,229,255,0.04);
      }
      50% {
        box-shadow:
          0 0 12px rgba(0,229,255,0.7), 0 0 30px rgba(0,229,255,0.45),
          0 0 60px rgba(0,229,255,0.25), 0 0 100px rgba(0,229,255,0.15),
          0 0 150px rgba(0,229,255,0.08),
          inset 0 0 35px rgba(0,229,255,0.18), inset 0 0 60px rgba(0,229,255,0.06);
      }
    }
    .team-card:hover .team-card-frame::after {
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 1), transparent);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
    }

    .team-card-frame-content {
      transform: skewX(3deg);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      height: 100%;
      width: 100%;
      padding: 16px 8px;
      position: relative;
      z-index: 1;
      min-height: 0;
      gap: 0;
    }

    .team-card-zone {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }
    .team-card-zone--name { flex: 1 1 0; }
    .team-card-zone--emblem {
      flex: 2 1 0;
      container-type: size;
    }
    .team-card-zone--flag {
      flex: 3 1 0;
      container-type: size;
    }
    .team-card-zone--name::after,
    .team-card-zone--emblem::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.3), transparent);
      pointer-events: none;
    }
    .team-card-zone--emblem .team-card-logo {
      width: min(78cqmin, 100%);
      height: min(78cqmin, 100%);
      max-width: 100%;
      font-size: min(22px, 22cqmin);
    }
    .team-card-zone--flag .team-card-map-container {
      width: min(92cqmin, 100%);
      height: min(92cqmin, 100%);
      max-width: 100%;
      flex: 0 0 auto;
    }

    .team-card-header {
      text-align: center;
    }
    .team-card-abbr {
      font-size: 18px;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: 2px;
    }
    .team-card-subtitle {
      font-size: 11px;
      color: var(--accent-cyan);
      opacity: 0.7;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .team-card-logo {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--team-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4), 0 0 12px color-mix(in srgb, var(--team-color) 40%, transparent);
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: all 0.4s ease;
    }
    .team-card:hover .team-card-logo {
      transform: scale(1.15);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.5), 0 0 20px color-mix(in srgb, var(--team-color) 50%, transparent);
    }

    .team-card-map-container {
      width: 65px; height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--team-color) 30%, transparent));
      transition: all 0.4s ease;
    }
    .team-card:hover .team-card-map-container {
      opacity: 1;
      transform: scale(1.1);
    }
    .team-card-map-container svg {
      width: 100%; height: 100%;
      fill: var(--team-color);
    }

    .frame-corner {
      position: absolute;
      width: 12px; height: 12px;
      pointer-events: none;
      opacity: 0.4;
      transition: opacity 0.4s ease, box-shadow 0.4s ease;
    }
    .team-card:hover .frame-corner {
      opacity: 1;
    }
    .frame-corner-tl { top: 6px; left: 6px; border-top: 2px solid var(--accent-cyan); border-left: 2px solid var(--accent-cyan); }
    .frame-corner-tr { top: 6px; right: 6px; border-top: 2px solid var(--accent-cyan); border-right: 2px solid var(--accent-cyan); }
    .frame-corner-bl { bottom: 6px; left: 6px; border-bottom: 2px solid var(--accent-cyan); border-left: 2px solid var(--accent-cyan); }
    .frame-corner-br { bottom: 6px; right: 6px; border-bottom: 2px solid var(--accent-cyan); border-right: 2px solid var(--accent-cyan); }



    /* ===== Type Selection Page ===== */
    #pageTypeSelect.page {
      /* 为卡片 hover 上移 + 外发光在 overflow-y:auto 下不被顶部裁切：padding 留出安全区，下行用负 margin 抵消布局位移 */
      --type-hover-bleed: clamp(48px, 8vmin, 88px);
      justify-content: flex-start;
      overflow-y: auto;
      overflow-x: visible;
      min-height: 0;
      padding-top: var(--type-hover-bleed);
      padding-bottom: 20px;
      /* 为 skew、入场动画 translateX 留出空间，避免在 overflow-y:auto 下横向被裁 */
      padding-left: clamp(24px, 4vw, 56px);
      padding-right: clamp(16px, 3vw, 36px);
      box-sizing: border-box;
    }
    .type-select-row {
      display: flex;
      align-items: stretch; /* Stretch cards to fill the provincial card height */
      justify-content: center;
      gap: 28px;
      width: 100%;
      max-width: min(1520px, 100%);
      margin-top: calc(-1 * var(--type-hover-bleed, 0px));
      perspective: 1200px;
      overflow: visible;
      position: relative;
      z-index: 0;
    }
    .type-team-spot {
      flex: 0 0 auto;
      width: var(--home-team-card-width);
      height: var(--home-team-card-height);
      min-width: 0;
      display: flex;
      align-items: stretch;
      position: relative;
      z-index: 2;
      overflow: visible;
    }
    /* 题型页省区卡：与首页相同的斜长 team-card-frame，仅外层加进入动画 */
    .type-team-card-shell {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      transform-style: preserve-3d;
      pointer-events: none;
      overflow: visible;
      --team-card-enter-duration: 0.9s;
    }
    .type-team-card--enter {
      animation: typeTeamCardSlideIn var(--team-card-enter-duration) cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes typeTeamCardSlideIn {
      0% {
        transform: translateX(72px) translateZ(-40px) scale(0.82) rotateY(-14deg);
        opacity: 0;
        filter: blur(10px) brightness(1.4);
      }
      45% {
        transform: translateX(-14px) translateZ(12px) scale(1.07) rotateY(6deg);
        opacity: 1;
        filter: blur(0) brightness(1.15);
      }
      72% {
        transform: translateX(8px) translateZ(0) scale(0.98) rotateY(-3deg);
        filter: blur(0) brightness(1.05);
      }
      100% {
        transform: translateX(0) translateZ(0) scale(1) rotateY(0);
        opacity: 1;
        filter: blur(0) brightness(1);
      }
    }
    #pageTypeSelect .type-team-spot .team-card-frame {
      width: 100%;
      height: 100%;
      flex: none;
      min-height: 0;
      aspect-ratio: unset;
      overflow: visible;
    }
    /* 与 #pageTeamSelect 省区卡内排版一致（同尺寸同字号） */
    #pageTypeSelect .type-team-spot .team-card-frame-content {
      padding: clamp(14px, 2.2vmin, 28px) clamp(8px, 1.2vmin, 14px);
    }
    #pageTypeSelect .type-team-spot .team-card-abbr {
      font-size: clamp(18px, 2.4vmin, 36px);
    }
    #pageTypeSelect .type-team-spot .team-card-subtitle {
      font-size: clamp(10px, 1.35vmin, 15px);
    }
    #pageTypeSelect .type-team-spot .team-card-zone--emblem .team-card-logo {
      width: min(80cqmin, 100%);
      height: min(80cqmin, 100%);
      font-size: clamp(16px, 24cqmin, 40px);
    }
    #pageTypeSelect .type-team-spot .team-card-zone--flag .team-card-map-container {
      width: min(94cqmin, 100%);
      height: min(94cqmin, 100%);
    }
    #pageTypeSelect .type-team-spot .frame-corner {
      width: clamp(12px, 1.4vmin, 16px);
      height: clamp(12px, 1.4vmin, 16px);
    }
    .type-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px; /* Increased gap for larger cards */
      max-width: 100%;
      width: 100%;
      flex: 1 1 0;
      min-width: 0;
      position: relative;
      z-index: 1;
    }
    .type-card {
      --type-card-art: none;
      background: rgba(6, 10, 28, 0.95);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 22px 22px 36px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      isolation: isolate;
    }
    /* 题型整卡背景图 + 自上而下罩层，底部加深保证文案可读 */
    .type-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      z-index: 0;
      pointer-events: none;
      background-color: #0a1430;
      background-image:
        linear-gradient(180deg,
          rgba(4, 8, 22, 0.06) 0%,
          rgba(4, 8, 22, 0.12) 32%,
          rgba(4, 8, 22, 0.48) 68%,
          rgba(4, 8, 22, 0.88) 100%),
        var(--type-card-art);
      background-size: cover, cover;
      background-position: center center, center center;
      background-repeat: no-repeat;
      filter: brightness(1.14) contrast(1.08) saturate(1.06);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.18);
    }
    .type-card[data-type="single"]::after {
      background-position: center center, center 52%;
    }
    .type-card::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 28%, rgba(0,229,255,0.16), transparent 55%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .type-card:hover {
      border-color: rgba(0,229,255,0.3);
      transform: translateY(-8px);
      box-shadow: var(--glow-cyan-strong);
    }
    .type-card:hover::before { opacity: 1; }
    .type-card:hover::after {
      filter: brightness(1.22) contrast(1.1) saturate(1.08);
    }
    .type-card:hover::after { transform: scale(1.045); }
    .type-card .type-info {
      flex-shrink: 0;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .type-card .type-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.75);
    }
    .type-card .type-score {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.85));
      margin-bottom: 12px;
    }
    .type-card .type-remain {
      font-size: 15px;
      color: rgba(230, 238, 255, 0.88);
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
    }
    .type-card.disabled {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    /* ===== Question Draw Page ===== */
    /* 题目抽选：去掉标题区后占满主区，必要时纵向滚动以看全格子 */
    #pageQuestionDraw.page {
      min-height: 0;
      flex: 1;
      justify-content: flex-start;
      padding-top: 4px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .draw-container {
      max-width: 100%;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .tile {
      --tile-bg: none;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid rgba(0,229,255,0.38);
      background-color: transparent;
      background-image:
        linear-gradient(145deg, rgba(6,16,48,0.62), rgba(4,10,32,0.72)),
        var(--tile-bg);
      background-size: cover, cover;
      background-position: center, center;
      background-repeat: no-repeat;
      color: rgba(0,229,255,0.88);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .tile-num {
      position: relative;
      z-index: 2;
      font-size: clamp(18px, min(3.2vw, 3.6vh), 28px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: #f4feff;
      letter-spacing: -0.03em;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 1),
        0 1px 0 rgba(0, 0, 0, 0.92),
        0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 14px rgba(0, 229, 255, 0.65);
    }
    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      z-index: 1;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.4), transparent);
    }
    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 0%, rgba(0,229,255,0.06), transparent 65%);
      pointer-events: none;
    }
    .tile:not(.used):not(.selected):hover {
      border-color: rgba(120,245,255,0.85);
      background-image:
        linear-gradient(145deg, rgba(0,229,255,0.32), rgba(41,121,255,0.28)),
        var(--tile-bg);
      color: #00e5ff;
      transform: scale(1.12) translateY(-2px);
      box-shadow:
        0 0 0 1px rgba(0,229,255,0.45),
        0 0 20px rgba(0,229,255,0.42),
        0 4px 14px rgba(0,0,0,0.35),
        inset 0 0 0 1px rgba(0,229,255,0.2);
    }
    .tile:not(.used):not(.selected):hover .tile-num {
      color: #fff;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 1),
        0 1px 0 rgba(0, 0, 0, 0.92),
        0 2px 8px rgba(0, 0, 0, 0.95),
        0 0 16px rgba(0, 229, 255, 0.75);
    }
    .tile.highlight {
      border-color: #7ef8ff;
      background-image:
        linear-gradient(145deg, rgba(0,229,255,0.4), rgba(41,121,255,0.32)),
        var(--tile-bg);
      color: var(--accent-cyan);
      box-shadow:
        0 0 0 2px rgba(0,229,255,0.55),
        0 0 22px rgba(0,229,255,0.5),
        inset 0 0 0 1px rgba(180,250,255,0.35);
    }
    .tile.selected {
      border-color: #b8ffff;
      background-image:
        linear-gradient(145deg, rgba(0,229,255,0.38), rgba(41,121,255,0.36)),
        var(--tile-bg);
      color: #fff;
      box-shadow:
        0 0 0 2px rgba(0,229,255,0.7),
        0 0 28px rgba(0,229,255,0.65),
        0 0 48px rgba(0,229,255,0.22),
        inset 0 0 0 1px rgba(200,255,255,0.45);
      transform: scale(1.18) translateY(-3px);
      z-index: 2;
      animation: tilePulse 1.2s ease infinite;
    }
    .tile.used {
      opacity: 0.12;
      background-image:
        linear-gradient(145deg, rgba(5,12,40,0.88), rgba(5,12,40,0.92)),
        var(--tile-bg);
      border-color: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.15);
    }
    .tile.used .tile-num {
      font-size: clamp(14px, min(2.4vw, 2.6vh), 20px);
      color: rgba(255,255,255,0.22);
      text-shadow: none;
    }
    .tile.highlight .tile-num,
    .tile.selected .tile-num {
      color: #fff;
      text-shadow:
        0 0 2px rgba(0, 0, 0, 1),
        0 1px 0 rgba(0, 0, 0, 0.92),
        0 2px 8px rgba(0, 0, 0, 0.95),
        0 0 18px rgba(0, 255, 255, 0.85);
    }
    .tile.used::before, .tile.used::after { display: none; }
    @keyframes tilePulse {
      0%, 100% {
        box-shadow:
          0 0 0 2px rgba(0,229,255,0.65),
          0 0 26px rgba(0,229,255,0.55),
          0 0 44px rgba(0,229,255,0.2),
          inset 0 0 0 1px rgba(200,255,255,0.4);
      }
      50% {
        box-shadow:
          0 0 0 2px rgba(0,255,255,0.85),
          0 0 34px rgba(0,229,255,0.72),
          0 0 56px rgba(0,229,255,0.28),
          inset 0 0 0 1px rgba(220,255,255,0.55);
      }
    }

    /* ===== Buttons ===== */
    .btn-primary {
      padding: 14px 50px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 3px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(41,121,255,0.2);
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 36px rgba(41,121,255,0.35), 0 0 20px rgba(156,39,176,0.15);
    }
    .btn-primary:active { transform: translateY(-1px); }
    .btn-primary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      padding: 12px 36px;
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--accent-cyan);
      background: rgba(0,229,255,0.04);
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .btn-secondary:hover {
      background: rgba(0,229,255,0.1);
      border-color: rgba(0,229,255,0.4);
      box-shadow: 0 0 20px rgba(0,229,255,0.1);
    }

    /* ===== Answer Page ===== */
    .answer-container {
      max-width: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .answer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }
    .question-type-tag {
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
    }
    .timer-container {
      position: relative;
      width: 88px; height: 88px;
    }
    .timer-ring {
      width: 88px; height: 88px;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 8px rgba(0,229,255,0.3));
    }
    .timer-ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.05);
      stroke-width: 4;
    }
    .timer-ring-progress {
      fill: none;
      stroke: var(--accent-cyan);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
      filter: drop-shadow(0 0 6px currentColor);
    }
    .timer-ring-progress.warning { stroke: var(--warning); }
    .timer-ring-progress.danger { stroke: var(--danger); }
    .timer-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .timer-text.warning { color: var(--warning); text-shadow: 0 0 10px rgba(255,171,64,0.3); }
    .timer-text.danger { color: var(--danger); text-shadow: 0 0 10px rgba(255,82,82,0.3); animation: timerPulse 0.5s ease infinite; }
    @keyframes timerPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }
    .question-content {
      width: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0,229,255,0.08);
      border-radius: 14px;
      padding: 30px 36px;
      margin-bottom: 22px;
      font-size: 18px;
      line-height: 1.8;
      min-height: 80px;
      position: relative;
    }
    .question-content::before {
      content: '';
      position: absolute;
      top: 0; left: 20px; right: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.3), transparent);
    }
    .options-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }
    .option-item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 16px;
      line-height: 1.6;
      position: relative;
      overflow: hidden;
    }
    .option-item:hover {
      border-color: rgba(0,229,255,0.2);
      background: rgba(0,229,255,0.05);
      transform: translateX(4px);
    }
    .option-item.selected {
      border-color: var(--accent-cyan);
      background: rgba(0,229,255,0.08);
      box-shadow: 0 0 24px rgba(0,229,255,0.08), inset 0 0 20px rgba(0,229,255,0.03);
    }
    .option-item.correct {
      border-color: var(--success);
      background: rgba(0,230,118,0.08);
      box-shadow: 0 0 20px rgba(0,230,118,0.1);
    }
    .option-item.wrong {
      border-color: var(--danger);
      background: rgba(255,82,82,0.08);
      box-shadow: 0 0 20px rgba(255,82,82,0.1);
    }
    .option-item .option-marker {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .option-item.selected .option-marker {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan);
      color: var(--bg-primary);
      box-shadow: 0 0 12px rgba(0,229,255,0.4);
    }
    .option-item.correct .option-marker {
      border-color: var(--success);
      background: var(--success);
      color: var(--bg-primary);
      box-shadow: 0 0 12px rgba(0,230,118,0.4);
    }
    .option-item.wrong .option-marker {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
      box-shadow: 0 0 12px rgba(255,82,82,0.4);
    }
    .option-item.disabled { pointer-events: none; opacity: 0.65; }

    /* ===== Result Page ===== */
    .result-container {
      max-width: 100%;
      width: 100%;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 20px;
    }
    .result-container::-webkit-scrollbar { width: 4px; }
    .result-container::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 2px; }
    .result-main {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }
    .result-answer-box {
      flex: 0 0 200px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .result-answer-box.correct { border-color: rgba(0,230,118,0.25); box-shadow: 0 0 30px rgba(0,230,118,0.08); }
    .result-answer-box.wrong { border-color: rgba(255,82,82,0.25); box-shadow: 0 0 30px rgba(255,82,82,0.08); }
    .result-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 14px;
      animation: resultPop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes resultPop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .result-icon.correct {
      background: rgba(0,230,118,0.12);
      color: var(--success);
      border: 2px solid rgba(0,230,118,0.3);
      box-shadow: 0 0 24px rgba(0,230,118,0.15);
    }
    .result-icon.wrong {
      background: rgba(255,82,82,0.12);
      color: var(--danger);
      border: 2px solid rgba(255,82,82,0.3);
      box-shadow: 0 0 24px rgba(255,82,82,0.15);
    }
    .result-label { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .result-score-change { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
    .result-question-box {
      flex: 1;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 26px;
    }
    .result-question-text { font-size: 15px; line-height: 1.7; margin-bottom: 14px; }
    .result-correct-answer {
      font-size: 14px;
      color: var(--success);
      padding: 8px 14px;
      background: rgba(0,230,118,0.06);
      border: 1px solid rgba(0,230,118,0.15);
      border-radius: 8px;
      display: inline-block;
    }
    .result-your-answer {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      display: inline-block;
      margin-left: 8px;
    }
    .result-your-answer.correct { color: var(--success); background: rgba(0,230,118,0.06); border: 1px solid rgba(0,230,118,0.15); }
    .result-your-answer.wrong { color: var(--danger); background: rgba(255,82,82,0.06); border: 1px solid rgba(255,82,82,0.15); }
    .other-teams-section { margin-bottom: 20px; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .section-hint { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
    .other-teams-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .other-team-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }
    .other-team-item:hover { border-color: rgba(0,229,255,0.2); }
    .other-team-item .ot-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .other-team-item .ot-name {
      flex: 1; font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .other-team-item .ot-status { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 4px; }
    .other-team-item.ot-correct .ot-status { color: var(--success); background: rgba(0,230,118,0.1); }
    .other-team-item.ot-wrong .ot-status { color: var(--danger); background: rgba(255,82,82,0.1); }
    .other-team-item.ot-unset .ot-status { color: var(--text-secondary); background: rgba(255,255,255,0.04); }
    .score-breakdown {

    /* ===== Score Burst Particles ===== */

<script>
/* ============================================================
   Particle Network Background
   ============================================================ */
(function() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h;
  const PARTICLE_COUNT = 70;
  const CONNECT_DIST = 200;
  const MOUSE_DIST = 250;
  let mouse = { x: -1000, y: -1000 };

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        r: Math.random() * 3.5 + 1.5,
        o: Math.random() * 0.5 + 0.25
      });
    }
  }

  function drawParticles() {
    ctx.clearRect(0, 0, w, h);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 229, 255, ${p.o})`;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT_DIST) {
          const alpha = (1 - dist / CONNECT_DIST) * 0.15;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      const mdx = p.x - mouse.x;
      const mdy = p.y - mouse.y;
      const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
      if (mdist < MOUSE_DIST) {
        const alpha = (1 - mdist / MOUSE_DIST) * 0.35;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    requestAnimationFrame(drawParticles);
  }

  window.addEventListener('resize', () => { resize(); createParticles(); });
  document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  document.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });

  resize();
  createParticles();
  drawParticles();
})();

  const map = { teamSelect: 'pageTeamSelect', typeSelect: 'pageTypeSelect', questionDraw: 'pageQuestionDraw', answer: 'pageAnswer', result: 'pageResult' };

          <div class="team-card-zone team-card-zone--name">
            <div class="team-card-header">
              <div class="team-card-abbr">${t.abbr}</div>
              <div class="team-card-subtitle">（${t.name}）</div>
            </div>
          </div>
          <div class="team-card-zone team-card-zone--emblem">
            <div class="team-card-logo">${t.abbr}</div>
          </div>
          <div class="team-card-zone team-card-zone--flag">
            <div class="team-card-map-container">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${mapPath}</svg>
            </div>
          </div>
        </div>

        <div class="frame-corner frame-corner-tl"></div>
        <div class="frame-corner frame-corner-tr"></div>
        <div class="frame-corner frame-corner-bl"></div>
        <div class="frame-corner frame-corner-br"></div>
      </div>
    </div>`;
  }).join('');
}

function selectTeam(idx) {
  state.currentTeamIdx = idx;
  state.selectedOptions = [];
  state.isSubmitted = false;
  state.settled = false;
  renderTypeGrid();
  showPage('typeSelect');
}

function renderTypeGrid(playTeamCardAnim) {
  const spot = $('#typeTeamSpot');
  if (spot) {
    const wantAnim = playTeamCardAnim !== false;
    spot.innerHTML = state.currentTeamIdx >= 0
      ? renderTypeTeamCard(state.currentTeamIdx, wantAnim)
      : '';
  }
  const types = ['judge', 'single', 'multi', 'uncertain'];
  $('#typeGrid').innerHTML = types.map(type => {
    const cfg = TYPE_CONFIG[type];
    const remain = QUESTIONS[type].length - state.usedQuestions[type].size;
    const cardStyle = cfg.img ? ` style="--type-card-art: url('${cfg.img}')"` : '';
    return `
      <div class="type-card ${remain <= 0 ? 'disabled' : ''}" data-type="${type}" onclick="selectType('${type}')"${cardStyle}>
        <div class="type-info">
          <div class="type-name">${cfg.name}</div>
          <div class="type-score">${cfg.score}分</div>
          <div class="type-remain">剩余 ${remain} 题</div>
        </div>
      </div>
    `;
  }).join('');
}

function selectType(type) {
  const card = $(`.type-card[data-type="${type}"]`);
  if (card) {
    card.classList.add('energy-active');
    setTimeout(() => card.classList.remove('energy-active'), 700);
  }
  state.currentType = type;
  state.drawSelectedTile = -1;
  setTimeout(() => {
    renderDrawPage();
    showPage('questionDraw');
  }, 350);
}

function renderDrawPage() {
  state.drawSelectedTile = -1;
  const usedTiles = state.usedTiles[state.currentType];
  const tileBg = TYPE_CONFIG[state.currentType].tileImg;
  const tileBgCss = tileBg ? `url('${tileBg}')` : 'none';
  let html = '';
  for (let i = 1; i <= 50; i++) {
    const isUsed = usedTiles.has(i);
    html += `<div class="tile ${isUsed ? 'used' : ''}" id="tile-${i}" style="--tile-bg: ${tileBgCss}" ${isUsed ? '' : `onclick="selectTile(${i})"`}><span class="tile-num">${i}</span></div>`;
  }
  $('#tileGrid').innerHTML = html;
}

function selectTile(num) {
  state.drawSelectedTile = num;
  const el = $(`#tile-${num}`);
  if (el) el.classList.add('selected');

  const type = state.currentType;
  const pool = QUESTIONS[type];
  const usedQ = state.usedQuestions[type];
  const avail = [];
  for (let i = 0; i < pool.length; i++) { if (!usedQ.has(i)) avail.push(i); }
  if (!avail.length) return;
  const qIdx = avail[Math.floor(Math.random() * avail.length)];
  state.currentQuestion = { ...pool[qIdx], _idx: qIdx };
  state.usedQuestions[type].add(qIdx);
  state.usedTiles[type].add(num);

  setTimeout(() => {
    renderAnswerPage();
    showPage('answer');
    startTimer();
  }, 350);
}

function renderAnswerPage() {
  const type = state.currentType;
  const cfg = TYPE_CONFIG[type];
  const q = state.currentQuestion;
  $('#answerBadge').innerHTML = makeTeamBadge(state.currentTeamIdx);
  const tag = $('#answerTypeTag');
  tag.textContent = `${cfg.name} · ${cfg.score}分`;
  const tc = { judge: '#4fc3f7', single: '#81c784', multi: '#ffb74d', uncertain: '#ce93d8' }[type];
  tag.style.background = `${tc}18`;
  tag.style.color = tc;
  tag.style.border = `1px solid ${tc}40`;
  $('#questionContent').textContent = q.q;
  state.selectedOptions = [];
  state.isSubmitted = false;
  $('#btnSubmit').disabled = false;
  $('#btnSubmit').textContent = '提交答案';
  const list = $('#optionsList');
  if (type === 'judge') {
    list.innerHTML = ['正确', '错误'].map((text, i) =>
      `<div class="option-item" onclick="toggleOption(${i})" id="opt-${i}"><div class="option-marker">${String.fromCharCode(65+i)}</div><span>${text}</span></div>`
    ).join('');
  } else {
    list.innerHTML = q.options.map((text, i) =>
      `<div class="option-item" onclick="toggleOption(${i})" id="opt-${i}"><div class="option-marker">${'ABCD'[i]}</div><span>${text}</span></div>`
    ).join('');
  }
  resetTimer();
}

function toggleOption(idx) {
  if (state.isSubmitted) return;
  const type = state.currentType;
  if (type === 'judge' || type === 'single') { state.selectedOptions = [idx]; }
  else { const p = state.selectedOptions.indexOf(idx); p >= 0 ? state.selectedOptions.splice(p,1) : state.selectedOptions.push(idx); }
  updateOptionUI();
}

function updateOptionUI() {
  const n = state.currentType === 'judge' ? 2 : state.currentQuestion.options.length;
  for (let i = 0; i < n; i++) { const el = $(`#opt-${i}`); if (el) el.classList.toggle('selected', state.selectedOptions.includes(i)); }
}

function resetTimer() { state.timeLeft = TIMER_SECONDS; updateTimerUI(); }
function startTimer() {
  clearInterval(state.timerInterval);
  state.timeLeft = TIMER_SECONDS;
  updateTimerUI();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();
    if (state.timeLeft <= 0) { clearInterval(state.timerInterval); if (!state.isSubmitted) submitAnswer(); }
  }, 1000);
}
function updateTimerUI() {
  const t = state.timeLeft, total = TIMER_SECONDS;
  const offset = 2 * Math.PI * 45 * (1 - t / total);
  const circle = $('#timerCircle');
  circle.setAttribute('stroke-dashoffset', offset);
  circle.classList.remove('warning', 'danger');
  const text = $('#timerText');
  text.textContent = t;
  text.classList.remove('warning', 'danger');
  if (t <= 5) { circle.classList.add('danger'); text.classList.add('danger'); }
  else if (t <= 10) { circle.classList.add('warning'); text.classList.add('warning'); }
}

function submitAnswer() {
  if (state.isSubmitted) return;
  state.isSubmitted = true;
  clearInterval(state.timerInterval);
  $('#btnSubmit').disabled = true;
  $('#btnSubmit').textContent = '已提交';
  showAnswerFeedback();
  setTimeout(() => { renderResultPage(); showPage('result'); }, 1500);
}

function showAnswerFeedback() {
  const q = state.currentQuestion, type = state.currentType;
  let correctSet;
  if (type === 'judge') correctSet = q.answer ? [0] : [1];
  else if (type === 'single') correctSet = [q.answer];
  else correctSet = [...q.answer];
  const n = type === 'judge' ? 2 : q.options.length;
  for (let i = 0; i < n; i++) {
    const el = $(`#opt-${i}`); if (!el) continue;
    el.classList.add('disabled'); el.classList.remove('selected');
    if (correctSet.includes(i)) el.classList.add('correct');
    if (state.selectedOptions.includes(i) && !correctSet.includes(i)) el.classList.add('wrong');
  }
}

function renderResultPage() {
  const q = state.currentQuestion, type = state.currentType, cfg = TYPE_CONFIG[type];
  const isCorrect = checkCorrect();
  $('#resultAnswerBox').className = `result-answer-box ${isCorrect ? 'correct' : 'wrong'}`;
  const icon = $('#resultIcon');
  icon.className = `result-icon ${isCorrect ? 'correct' : 'wrong'}`;
  icon.innerHTML = isCorrect
    ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>'
    : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $('#resultLabel').textContent = isCorrect ? '回答正确' : '回答错误';
  $('#resultScorePreview').textContent = `基础分：${isCorrect ? '+' : '-'}${cfg.score}分`;
  $('#resultQuestionText').textContent = q.q;
  let correctStr;
  if (type === 'judge') correctStr = q.answer ? '正确' : '错误';
  else if (type === 'single') correctStr = String.fromCharCode(65 + q.answer);
  else correctStr = q.answer.map(i => String.fromCharCode(65 + i)).join('');
  $('#resultCorrectAnswer').textContent = `正确答案：${correctStr}`;
  let yourStr;
  if (!state.selectedOptions.length) yourStr = '未作答';
  else if (type === 'judge') yourStr = state.selectedOptions[0] === 0 ? '正确' : '错误';
  else yourStr = state.selectedOptions.sort().map(i => String.fromCharCode(65 + i)).join('');
  const yourEl = $('#resultYourAnswer');
  yourEl.textContent = `你的答案：${yourStr}`;
  yourEl.className = `result-your-answer ${isCorrect ? 'correct' : 'wrong'}`;
  state.otherTeamResults = {};
  $('#otherTeamsGrid').innerHTML = state.teams.filter((_, i) => i !== state.currentTeamIdx).map(t =>
    `<div class="other-team-item ot-unset" id="ot-${t.id}" onclick="toggleOtherTeam(${t.id})"><span class="ot-dot" style="background:${t.color}"></span><span class="ot-name">${t.name}</span><span class="ot-status">未设置</span></div>`
  ).join('');
  $('#scoreBreakdown').style.display = 'none';
  $('#btnSettle').classList.remove('hidden');
  $('#btnNext').classList.add('hidden');
  state.settled = false;
}

function checkCorrect() {
  const q = state.currentQuestion, type = state.currentType;
  const sel = [...state.selectedOptions].sort();
  if (type === 'judge') { const c = q.answer ? 0 : 1; return sel.length === 1 && sel[0] === c; }
  if (type === 'single') return sel.length === 1 && sel[0] === q.answer;
  const correct = [...q.answer].sort();
  return sel.length === correct.length && sel.every((v, i) => v === correct[i]);
}

function toggleOtherTeam(teamId) {
  if (state.settled) return;
  const c = state.otherTeamResults[teamId];
  if (c === undefined) state.otherTeamResults[teamId] = true;
  else if (c === true) state.otherTeamResults[teamId] = false;
  else delete state.otherTeamResults[teamId];
  const el = $(`#ot-${teamId}`); if (!el) return;
  el.classList.remove('ot-correct', 'ot-wrong', 'ot-unset');
  const s = el.querySelector('.ot-status');
  const v = state.otherTeamResults[teamId];
  if (v === true) { el.classList.add('ot-correct'); s.textContent = '答对'; }
  else if (v === false) { el.classList.add('ot-wrong'); s.textContent = '答错'; }
  else { el.classList.add('ot-unset'); s.textContent = '未设置'; }
}

/* ============================================================
   Score Animations (文档第九节 - 非常关键)
   ============================================================ */
function animateScore(el, start, end, duration = 800) {
  let startTime = null;
  function update(time) {
    if (!startTime) startTime = time;
    const progress = Math.min((time - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = Math.floor(start + (end - start) * eased);
    el.textContent = value;
    if (progress < 1) requestAnimationFrame(update);
    else el.textContent = end;
  }
  requestAnimationFrame(update);
}

function showScoreFloat(text, isPositive) {
  const el = document.createElement('div');
  el.className = `score-float ${isPositive ? 'positive' : 'negative'}`;
  el.textContent = text;
  document.body.appendChild(el);
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'score-burst';
    p.style.left = '50%';
    p.style.top = '38%';
    p.style.background = isPositive ? 'var(--success)' : 'var(--danger)';
    const angle = (Math.PI * 2 / 8) * i + (Math.random() - 0.5) * 0.5;
    const dist = 40 + Math.random() * 60;
    p.style.setProperty('--bx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--by', `${Math.sin(angle) * dist}px`);
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1100);
  }
  setTimeout(() => el.remove(), 1900);
}

function settleScore() {
  if (state.settled) return;
  state.settled = true;
  const isCorrect = checkCorrect(), type = state.currentType, base = TYPE_CONFIG[type].score;
  const others = state.teams.filter((_, i) => i !== state.currentTeamIdx);
  let oC = 0, oW = 0, oU = 0;
  others.forEach(t => { const r = state.otherTeamResults[t.id]; if (r === true) oC++; else if (r === false) oW++; else oU++; });
  let sc, html;
  if (isCorrect) {
    const b = oW * 10; sc = base + b;
    html = `<div class="sb-line"><span>基础得分</span><span class="score-positive">+${base}分</span></div>
      <div class="sb-line"><span>其他队伍答错 ${oW} 支，额外加分</span><span class="score-positive">+${b}分</span></div>
      ${oU > 0 ? `<div class="sb-line"><span style="color:var(--text-secondary)">未设置队伍：${oU} 支（不计入）</span><span></span></div>` : ''}
      <div class="sb-line sb-total"><span>本轮得分</span><span class="score-positive">+${sc}分</span></div>`;
  } else {
    const p = oC * 10; sc = -(base + p);
    html = `<div class="sb-line"><span>基础扣分</span><span class="score-negative">-${base}分</span></div>
      <div class="sb-line"><span>其他队伍答对 ${oC} 支，额外扣分</span><span class="score-negative">-${p}分</span></div>
      ${oU > 0 ? `<div class="sb-line"><span style="color:var(--text-secondary)">未设置队伍：${oU} 支（不计入）</span><span></span></div>` : ''}
      <div class="sb-line sb-total"><span>本轮得分</span><span class="score-negative">${sc}分</span></div>`;
  }
  const bd = $('#scoreBreakdown'); bd.innerHTML = html; bd.style.display = 'block';
  state.teams[state.currentTeamIdx].score += sc;
  showScoreFloat(`${sc >= 0 ? '+' : ''}${sc}分`, sc >= 0);
  const previewEl = $('#resultScorePreview');
  previewEl.className = `result-score-change ${sc >= 0 ? 'score-positive' : 'score-negative'}`;
  animateScore(previewEl, 0, sc, 600);
  setTimeout(() => { previewEl.textContent = `本轮：${sc >= 0 ? '+' : ''}${sc}分`; }, 650);
  $('#btnSettle').classList.add('hidden');
  $('#btnNext').classList.remove('hidden');
  animateRankingUpdate();
}

function nextRound() { renderTeamGrid(); showPage('teamSelect'); }
function backToTypeSelect() { renderTypeGrid(false); showPage('typeSelect'); }

function renderRanking() {
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);
  const trophySvg = {
    0: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 17c-2.5 0-4-1-4-1v2h8v-2s-1.5 1-4 1z" fill="#ffd700"/><rect x="10" y="18" width="4" height="2" rx="0.5" fill="#ffd700"/><rect x="8" y="20" width="8" height="1.5" rx="0.5" fill="#ffd700"/><path d="M7 3h10v6c0 2.8-2.2 5-5 5s-5-2.2-5-5V3z" fill="#ffd700" stroke="#ff8f00" stroke-width="0.5"/><path d="M7 5H4c0 2.5 1.5 4 3 4.5" fill="#ffd700" stroke="#ff8f00" stroke-width="0.5"/><path d="M17 5h3c0 2.5-1.5 4-3 4.5" fill="#ffd700" stroke="#ff8f00" stroke-width="0.5"/></svg>`,
    1: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 17c-2.5 0-4-1-4-1v2h8v-2s-1.5 1-4 1z" fill="#c0c0c0"/><rect x="10" y="18" width="4" height="2" rx="0.5" fill="#c0c0c0"/><rect x="8" y="20" width="8" height="1.5" rx="0.5" fill="#c0c0c0"/><path d="M7 3h10v6c0 2.8-2.2 5-5 5s-5-2.2-5-5V3z" fill="#c0c0c0" stroke="#9e9e9e" stroke-width="0.5"/><path d="M7 5H4c0 2.5 1.5 4 3 4.5" fill="#c0c0c0" stroke="#9e9e9e" stroke-width="0.5"/><path d="M17 5h3c0 2.5-1.5 4-3 4.5" fill="#c0c0c0" stroke="#9e9e9e" stroke-width="0.5"/></svg>`,
    2: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 17c-2.5 0-4-1-4-1v2h8v-2s-1.5 1-4 1z" fill="#cd7f32"/><rect x="10" y="18" width="4" height="2" rx="0.5" fill="#cd7f32"/><rect x="8" y="20" width="8" height="1.5" rx="0.5" fill="#cd7f32"/><path d="M7 3h10v6c0 2.8-2.2 5-5 5s-5-2.2-5-5V3z" fill="#cd7f32" stroke="#8d5524" stroke-width="0.5"/><path d="M7 5H4c0 2.5 1.5 4 3 4.5" fill="#cd7f32" stroke="#8d5524" stroke-width="0.5"/><path d="M17 5h3c0 2.5-1.5 4-3 4.5" fill="#cd7f32" stroke="#8d5524" stroke-width="0.5"/></svg>`
  };
  $('#rankingList').innerHTML = sorted.map((t, i) => {
    const rc = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : 'normal';
    const ac = t.id === state.currentTeamIdx ? 'active-team' : '';
    const clickCls = (state.currentPage === 'teamSelect' || state.currentPage === 'typeSelect') ? 'rank-item--clickable' : '';
    const trophy = trophySvg[i]
      ? `<div class="rank-trophy">${trophySvg[i]}</div>`
      : '<div class="rank-trophy rank-trophy--empty" aria-hidden="true"></div>';
    return `<div class="rank-item ${ac} ${clickCls}" data-team-id="${t.id}" style="order:${i}">
      <div class="rank-num ${rc}">${i+1}</div>
      ${trophy}
      <div class="rank-avatar" style="background:${t.color}">${t.abbr}</div>
      <div class="rank-name">${t.name}</div>
      <div class="rank-score">${t.score}</div>
      <div class="rank-change"></div>
    </div>`;
  }).join('');
}

function animateRankingUpdate() {
  const list = $('#rankingList');
  const items = list.querySelectorAll('.rank-item');
  const oldPos = {}, oldRanks = {}, oldScores = {};
  items.forEach((item, i) => {
    const id = +item.dataset.teamId;
    oldPos[id] = item.getBoundingClientRect();
    oldRanks[id] = i;
    const scoreEl = item.querySelector('.rank-score');
    if (scoreEl) oldScores[id] = parseInt(scoreEl.textContent) || 0;
  });
  renderRanking();
  const newItems = list.querySelectorAll('.rank-item');
  const newRanks = {};
  newItems.forEach((item, i) => { newRanks[+item.dataset.teamId] = i; });
  newItems.forEach(item => {
    const id = +item.dataset.teamId;
    const oR = oldPos[id]; if (!oR) return;
    const nR = item.getBoundingClientRect();
    const dy = oR.top - nR.top;
    if (Math.abs(dy) > 1) {
      item.style.transform = `translateY(${dy}px)`;
      item.style.transition = 'none';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        item.style.transition = 'transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94)';
        item.style.transform = 'translateY(0)';
      }));
    }
    const scoreEl = item.querySelector('.rank-score');
    const team = state.teams.find(t => t.id === id);
    if (scoreEl && team && oldScores[id] !== undefined && oldScores[id] !== team.score) {
      animateScore(scoreEl, oldScores[id], team.score, 800);
    }
    const oRk = oldRanks[id], nRk = newRanks[id];
    if (oRk !== undefined && nRk !== undefined && oRk !== nRk) {
      const diff = oRk - nRk;
      const ch = item.querySelector('.rank-change');
      ch.textContent = diff > 0 ? `+${diff}` : `${diff}`;
      ch.className = `rank-change show ${diff > 0 ? 'up' : 'down'}`;
      setTimeout(() => ch.classList.remove('show'), 3000);
    }
  });
}

let qrResizeObserver = null;
let qrResizeTimer = null;
function paintQRCode() {
  const c = $('#qrCode');
  if (!c || typeof QRCode === 'undefined') return;
  try {
    const w = c.clientWidth;
    const h = c.clientHeight;
    const side = Math.max(72, Math.min(Math.floor(Math.min(w, h) - 10), 560));
    if (w < 24 || h < 24) return;
    if (c.dataset.qrSide === String(side) && c.querySelector('canvas, img')) return;
    c.dataset.qrSide = String(side);
    c.innerHTML = '';
    new QRCode(c, {
      text: QR_URL,
      width: side,
      height: side,
      colorDark: '#e8ecf1',
      colorLight: '#050816',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch (e) {
    c.textContent = '二维码区域';
  }
}
function schedulePaintQRCode() {
  clearTimeout(qrResizeTimer);
  qrResizeTimer = setTimeout(() => { requestAnimationFrame(paintQRCode); }, 60);
}
function initQRCode() {
  const c = $('#qrCode');
  if (!c) return;
  if (qrResizeObserver) qrResizeObserver.disconnect();
  qrResizeObserver = new ResizeObserver(schedulePaintQRCode);
  qrResizeObserver.observe(c);
  schedulePaintQRCode();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); $('#btnFullscreen').textContent = '退出全屏'; }
  else { document.exitFullscreen(); $('#btnFullscreen').textContent = '全屏显示'; }
}
document.addEventListener('fullscreenchange', () => { $('#btnFullscreen').textContent = document.fullscreenElement ? '退出全屏' : '全屏显示'; });

function onRankingTeamPick(teamId) {
  if (state.currentPage === 'teamSelect') {
    selectTeam(teamId);
    return;
  }
  if (state.currentPage === 'typeSelect') {
    if (teamId === state.currentTeamIdx) return;
    state.currentTeamIdx = teamId;
    state.selectedOptions = [];
    state.isSubmitted = false;
    state.settled = false;
    renderTypeGrid(true);
    renderRanking();
  }
}

function init() {
  renderTeamGrid();
  renderRanking();
  initQRCode();
  const rk = $('#rankingList');
  if (rk) {
    rk.addEventListener('click', e => {
      const row = e.target.closest('.rank-item');
      if (!row || !row.classList.contains('rank-item--clickable')) return;
      const id = +row.dataset.teamId;
      if (Number.isNaN(id)) return;
      onRankingTeamPick(id);
    });
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
