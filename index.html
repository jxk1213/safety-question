<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI申通·AI安全 - 安全知识竞答</title>
  <style>
    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #111638;
      --bg-card: rgba(15, 25, 60, 0.85);
      --bg-card-hover: rgba(20, 35, 80, 0.9);
      --accent-cyan: #00d4ff;
      --accent-blue: #2979ff;
      --accent-purple: #7c4dff;
      --text-primary: #e8ecf1;
      --text-secondary: #8892a4;
      --success: #00e676;
      --danger: #ff5252;
      --warning: #ffab40;
      --border-glow: rgba(0, 212, 255, 0.25);
      --sidebar-width: 320px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    /* ===== Background Grid Effect ===== */
    .bg-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
    }
    .bg-glow {
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(0,212,255,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(124,77,255,0.04) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
      animation: bgFloat 20s ease-in-out infinite;
    }
    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-2%, 1%); }
    }
    /* ===== Main Area ===== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 36px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .main-header {
      text-align: center;
      padding: 8px 0 16px;
      flex-shrink: 0;
      position: relative;
    }
    .main-header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .main-header .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: 3px;
      margin-top: 4px;
    }
    .main-header::after {
      content: '';
      display: block;
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      margin: 12px auto 0;
    }
    /* ===== Pages ===== */
    .page {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: pageIn 0.5s ease;
    }
    .page.active { display: flex; }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }
    .current-team-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid var(--border-glow);
      background: rgba(0,212,255,0.08);
      font-size: 14px;
      color: var(--accent-cyan);
      margin-bottom: 20px;
    }
    .current-team-badge .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    /* ===== Team Selection Page ===== */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      max-width: 900px;
      width: 100%;
    }
    .team-card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .team-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: var(--team-color);
      opacity: 0.6;
    }
    .team-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0,212,255,0.1);
    }
    .team-card .team-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: var(--team-color);
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .team-card .team-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .team-card .team-score-info {
      font-size: 13px;
      color: var(--text-secondary);
    }
    /* ===== Type Selection Page ===== */
    .type-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 960px;
      width: 100%;
    }
    .type-card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .type-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0,212,255,0.15);
    }
    .type-card .type-icon {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      border: 2px solid;
    }
    .type-card[data-type="judge"] .type-icon {
      color: #4fc3f7; border-color: rgba(79,195,247,0.3);
      background: rgba(79,195,247,0.1);
    }
    .type-card[data-type="single"] .type-icon {
      color: #81c784; border-color: rgba(129,199,132,0.3);
      background: rgba(129,199,132,0.1);
    }
    .type-card[data-type="multi"] .type-icon {
      color: #ffb74d; border-color: rgba(255,183,77,0.3);
      background: rgba(255,183,77,0.1);
    }
    .type-card[data-type="uncertain"] .type-icon {
      color: #ce93d8; border-color: rgba(206,147,216,0.3);
      background: rgba(206,147,216,0.1);
    }
    .type-card .type-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .type-card .type-score {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .type-card .type-remain {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .type-card.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    /* ===== Question Draw Page ===== */
    .draw-container {
      max-width: 880px;
      width: 100%;
    }
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-bottom: 28px;
    }
    .tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: default;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--bg-card);
      color: var(--text-secondary);
      transition: all 0.15s ease;
      position: relative;
    }
    .tile.highlight {
      border-color: var(--accent-cyan);
      background: rgba(0,212,255,0.15);
      color: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(0,212,255,0.3);
    }
    .tile.selected {
      border-color: var(--accent-cyan);
      background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(41,121,255,0.25));
      color: #fff;
      box-shadow: 0 0 24px rgba(0,212,255,0.4);
      transform: scale(1.1);
      z-index: 2;
      animation: tilePulse 1s ease infinite;
    }
    .tile.used {
      opacity: 0.25;
      background: rgba(255,255,255,0.02);
      border-color: transparent;
    }
    @keyframes tilePulse {
      0%, 100% { box-shadow: 0 0 24px rgba(0,212,255,0.4); }
      50% { box-shadow: 0 0 36px rgba(0,212,255,0.6); }
    }
    .btn-primary {
      padding: 14px 48px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(41,121,255,0.3);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      padding: 12px 36px;
      border: 1px solid var(--border-glow);
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      color: var(--accent-cyan);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-left: 12px;
    }
    .btn-secondary:hover {
      background: rgba(0,212,255,0.08);
    }
    /* ===== Answer Page ===== */
    .answer-container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .answer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }
    .question-type-tag {
      padding: 4px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .timer-container {
      position: relative;
      width: 80px; height: 80px;
    }
    .timer-ring {
      width: 80px; height: 80px;
      transform: rotate(-90deg);
    }
    .timer-ring-bg {
      fill: none;
      stroke: rgba(255,255,255,0.06);
      stroke-width: 4;
    }
    .timer-ring-progress {
      fill: none;
      stroke: var(--accent-cyan);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
    }
    .timer-ring-progress.warning { stroke: var(--warning); }
    .timer-ring-progress.danger { stroke: var(--danger); }
    .timer-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .timer-text.warning { color: var(--warning); }
    .timer-text.danger { color: var(--danger); animation: timerPulse 0.5s ease infinite; }
    @keyframes timerPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }
    .question-content {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 24px;
      font-size: 18px;
      line-height: 1.8;
      min-height: 80px;
    }
    .options-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .option-item {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 16px;
      line-height: 1.6;
    }
    .option-item:hover {
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
    }
    .option-item.selected {
      border-color: var(--accent-cyan);
      background: rgba(0,212,255,0.1);
    }
    .option-item.correct {
      border-color: var(--success);
      background: rgba(0,230,118,0.1);
    }
    .option-item.wrong {
      border-color: var(--danger);
      background: rgba(255,82,82,0.1);
    }
    .option-item .option-marker {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }
    .option-item.selected .option-marker {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan);
      color: var(--bg-primary);
    }
    .option-item.correct .option-marker {
      border-color: var(--success);
      background: var(--success);
      color: var(--bg-primary);
    }
    .option-item.wrong .option-marker {
      border-color: var(--danger);
      background: var(--danger);
      color: #fff;
    }
    .option-item.disabled { pointer-events: none; opacity: 0.7; }
    /* ===== Result Page ===== */
    .result-container {
      max-width: 860px;
      width: 100%;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 20px;
    }
    .result-container::-webkit-scrollbar { width: 4px; }
    .result-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    .result-main {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }
    .result-answer-box {
      flex: 0 0 200px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .result-answer-box.correct { border-color: rgba(0,230,118,0.3); }
    .result-answer-box.wrong { border-color: rgba(255,82,82,0.3); }
    .result-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .result-icon.correct {
      background: rgba(0,230,118,0.15);
      color: var(--success);
      border: 2px solid rgba(0,230,118,0.3);
    }
    .result-icon.wrong {
      background: rgba(255,82,82,0.15);
      color: var(--danger);
      border: 2px solid rgba(255,82,82,0.3);
    }
    .result-label {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .result-score-change {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .result-question-box {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
    }
    .result-question-text {
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .result-correct-answer {
      font-size: 14px;
      color: var(--success);
      padding: 8px 14px;
      background: rgba(0,230,118,0.08);
      border-radius: 6px;
      display: inline-block;
    }
    .result-your-answer {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 6px;
      display: inline-block;
      margin-left: 8px;
    }
    .result-your-answer.correct { color: var(--success); background: rgba(0,230,118,0.08); }
    .result-your-answer.wrong { color: var(--danger); background: rgba(255,82,82,0.08); }
    .other-teams-section {
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .section-hint {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }
    .other-teams-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .other-team-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .other-team-item:hover { border-color: var(--border-glow); }
    .other-team-item .ot-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .other-team-item .ot-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .other-team-item .ot-status {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 4px;
    }
    .other-team-item.ot-correct .ot-status {
      color: var(--success);
      background: rgba(0,230,118,0.12);
    }
    .other-team-item.ot-wrong .ot-status {
      color: var(--danger);
      background: rgba(255,82,82,0.12);
    }
    .other-team-item.ot-unset .ot-status {
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
    }
    .score-breakdown {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 2;
      display: none;
    }
    .score-breakdown .sb-line {
      display: flex;
      justify-content: space-between;
    }
    .score-breakdown .sb-total {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 700;
    }
    .result-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }
    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: rgba(8, 12, 36, 0.95);
      border-left: 1px solid rgba(0,212,255,0.1);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }
    .sidebar-title {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0,212,255,0.12);
    }
    .ranking-list {
      flex: 1;
      overflow-y: auto;
      position: relative;
    }
    .ranking-list::-webkit-scrollbar { width: 3px; }
    .ranking-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
    .rank-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid transparent;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  background 0.3s ease, border-color 0.3s ease;
      position: relative;
    }
    .rank-item.active-team {
      border-color: var(--border-glow);
      background: rgba(0,212,255,0.06);
    }
    .rank-item.active-team::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 60%;
      background: var(--accent-cyan);
      border-radius: 0 2px 2px 0;
    }
    .rank-num {
      width: 24px; height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .rank-num.top1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a1a; }
    .rank-num.top2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #1a1a1a; }
    .rank-num.top3 { background: linear-gradient(135deg, #cd7f32, #a0622e); color: #fff; }
    .rank-num.normal { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
    .rank-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .rank-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

/* ============================================================
   State
   ============================================================ */
const state = {
  currentPage: 'teamSelect',
  currentTeamIdx: -1,
  currentType: null,
  currentQuestion: null,
  selectedOptions: [],
  timeLeft: TIMER_SECONDS,
  timerInterval: null,
  isSubmitted: false,
  teams: TEAM_CONFIG.map((t, i) => ({ ...t, id: i, score: 0 })),
  usedQuestions: { judge: new Set(), single: new Set(), multi: new Set(), uncertain: new Set() },
  usedTiles: { judge: new Set(), single: new Set(), multi: new Set(), uncertain: new Set() },
  otherTeamResults: {},
  drawSelectedTile: -1,
  settled: false
};

/* ============================================================
   DOM Helpers
   ============================================================ */
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

function showPage(name) {
  $$('.page').forEach(p => p.classList.remove('active'));
  const map = {
    teamSelect: 'pageTeamSelect',
    typeSelect: 'pageTypeSelect',
    questionDraw: 'pageQuestionDraw',
    answer: 'pageAnswer',
    result: 'pageResult'
  };
  $(`#${map[name]}`).classList.add('active');
  state.currentPage = name;
}

function makeTeamBadge(teamIdx) {
  const t = state.teams[teamIdx];
  return `<span class="dot" style="background:${t.color}"></span> 当前答题：${t.name}`;
}

/* ============================================================
   Team Selection (Page 0)
   ============================================================ */
function renderTeamGrid() {
  const grid = $('#teamGrid');
  grid.innerHTML = state.teams.slice(0, 8).map((t, i) => `
    <div class="team-card" style="--team-color:${t.color}" onclick="selectTeam(${i})">
      <div class="team-avatar" style="background:${t.color}">${t.abbr}</div>
      <div class="team-name">${t.name}</div>
      <div class="team-score-info">${t.score} 分</div>
    </div>
  `).join('');
}

function selectTeam(idx) {
  state.currentTeamIdx = idx;
  state.selectedOptions = [];
  state.isSubmitted = false;
  state.settled = false;
  renderTypeGrid();
  renderRanking();
  showPage('typeSelect');
}

/* ============================================================
   Type Selection (Page 1)
   ============================================================ */
function renderTypeGrid() {
  const badge = $('#typeBadge');
  badge.innerHTML = makeTeamBadge(state.currentTeamIdx);

  const grid = $('#typeGrid');
  const types = ['judge', 'single', 'multi', 'uncertain'];
  grid.innerHTML = types.map(type => {
    const cfg = TYPE_CONFIG[type];
    const pool = QUESTIONS[type];
    const remain = pool.length - state.usedQuestions[type].size;
    const disabled = remain <= 0 ? 'disabled' : '';
    return `
      <div class="type-card ${disabled}" data-type="${type}" onclick="selectType('${type}')">
        <div class="type-icon">${cfg.icon}</div>
        <div class="type-name">${cfg.name}</div>
        <div class="type-score">${cfg.score}分</div>
        <div class="type-remain">剩余 ${remain} 题</div>
      </div>
    `;
  }).join('');
}

function selectType(type) {
  state.currentType = type;
  state.drawSelectedTile = -1;
  renderDrawPage();
  showPage('questionDraw');
}

/* ============================================================
   Question Draw (Page 2)
   ============================================================ */
function renderDrawPage() {
  $('#drawBadge').innerHTML = makeTeamBadge(state.currentTeamIdx);
  $('#drawTitle').textContent = `题目抽选 - ${TYPE_CONFIG[state.currentType].name}`;
  $('#btnDraw').disabled = false;
  $('#btnDraw').textContent = '开始抽题';

  const grid = $('#tileGrid');
  const total = 50;
  const usedTiles = state.usedTiles[state.currentType];
  let html = '';
  for (let i = 1; i <= total; i++) {
    const usedClass = usedTiles.has(i) ? 'used' : '';
    html += `<div class="tile ${usedClass}" id="tile-${i}">${i}</div>`;
  }
  grid.innerHTML = html;
}

function startDraw() {
  const btn = $('#btnDraw');
  btn.disabled = true;
  btn.textContent = '抽取中...';

  const usedTiles = state.usedTiles[state.currentType];
  const availableTiles = [];
  for (let i = 1; i <= 50; i++) {
    if (!usedTiles.has(i)) availableTiles.push(i);
  }
  if (availableTiles.length === 0) return;

  const targetTile = availableTiles[Math.floor(Math.random() * availableTiles.length)];
  let step = 0;
  const totalSteps = 40 + Math.floor(Math.random() * 15);
  let currentHighlight = -1;

  function animate() {
    if (currentHighlight > 0) {
      const el = $(`#tile-${currentHighlight}`);
      if (el) el.classList.remove('highlight');
    }

    if (step >= totalSteps) {
      const finalEl = $(`#tile-${targetTile}`);
      if (finalEl) {
        finalEl.classList.add('selected');
      }
      state.drawSelectedTile = targetTile;
      setTimeout(() => showDrawResult(targetTile), 600);
      return;
    }

    const next = step >= totalSteps - 5 ? targetTile : availableTiles[Math.floor(Math.random() * availableTiles.length)];
    const el = $(`#tile-${next}`);
    if (el) el.classList.add('highlight');
    currentHighlight = next;

    step++;
    const baseDelay = 50;
    const progress = step / totalSteps;
    const delay = baseDelay + progress * progress * 200;
    setTimeout(animate, delay);
  }

  animate();
}

function showDrawResult(tileNum) {
  $('#drawResultNum').textContent = `第 ${tileNum} 题`;
  $('#drawOverlay').classList.add('show');

  const type = state.currentType;
  const pool = QUESTIONS[type];
  const usedQ = state.usedQuestions[type];
  const availableIdx = [];
  for (let i = 0; i < pool.length; i++) {
    if (!usedQ.has(i)) availableIdx.push(i);
  }
  const qIdx = availableIdx[Math.floor(Math.random() * availableIdx.length)];
  state.currentQuestion = { ...pool[qIdx], _idx: qIdx };
  state.usedQuestions[type].add(qIdx);
  state.usedTiles[type].add(tileNum);
}

function goToAnswer() {
  $('#drawOverlay').classList.remove('show');
  renderAnswerPage();
  showPage('answer');
  startTimer();
}

/* ============================================================
   Answer Page (Page 3)
   ============================================================ */
function renderAnswerPage() {
  const type = state.currentType;
  const cfg = TYPE_CONFIG[type];
  const q = state.currentQuestion;

  $('#answerBadge').innerHTML = makeTeamBadge(state.currentTeamIdx);

  const tag = $('#answerTypeTag');
  tag.textContent = `${cfg.name} · ${cfg.score}分`;
  const typeColors = { judge: '#4fc3f7', single: '#81c784', multi: '#ffb74d', uncertain: '#ce93d8' };
  const tc = typeColors[type] || '#4fc3f7';
  tag.style.background = `${tc}18`;
  tag.style.color = tc;
  tag.style.border = `1px solid ${tc}40`;

  $('#questionContent').textContent = q.q;

  state.selectedOptions = [];
  state.isSubmitted = false;
  $('#btnSubmit').disabled = false;
  $('#btnSubmit').textContent = '提交答案';

  const list = $('#optionsList');
  if (type === 'judge') {
    list.innerHTML = ['正确', '错误'].map((text, i) => `
      <div class="option-item" onclick="toggleOption(${i})" id="opt-${i}">
        <div class="option-marker">${String.fromCharCode(65 + i)}</div>
        <span>${text}</span>
      </div>
    `).join('');
  } else {
    const labels = ['A', 'B', 'C', 'D'];
    list.innerHTML = q.options.map((text, i) => `
      <div class="option-item" onclick="toggleOption(${i})" id="opt-${i}">
        <div class="option-marker">${labels[i]}</div>
        <span>${text}</span>
      </div>
    `).join('');
  }

  resetTimer();
}

function toggleOption(idx) {
  if (state.isSubmitted) return;
  const type = state.currentType;
  if (type === 'judge' || type === 'single') {
    state.selectedOptions = [idx];
  } else {
    const pos = state.selectedOptions.indexOf(idx);
    if (pos >= 0) state.selectedOptions.splice(pos, 1);
    else state.selectedOptions.push(idx);
  }
  updateOptionUI();
}

function updateOptionUI() {
  const optCount = state.currentType === 'judge' ? 2 : state.currentQuestion.options.length;
  for (let i = 0; i < optCount; i++) {
    const el = $(`#opt-${i}`);
    if (el) {
      el.classList.toggle('selected', state.selectedOptions.includes(i));
    }
  }
}

/* ============================================================
   Timer
   ============================================================ */
function resetTimer() {
  state.timeLeft = TIMER_SECONDS;
  updateTimerUI();
}

function startTimer() {
  clearInterval(state.timerInterval);
  state.timeLeft = TIMER_SECONDS;
  updateTimerUI();
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerInterval);
      if (!state.isSubmitted) submitAnswer();
    }
  }, 1000);
}

function updateTimerUI() {
  const t = state.timeLeft;
  const total = TIMER_SECONDS;
  const circumference = 2 * Math.PI * 45;
  const offset = circumference * (1 - t / total);

  const circle = $('#timerCircle');
  circle.setAttribute('stroke-dashoffset', offset);
  circle.classList.remove('warning', 'danger');

  const text = $('#timerText');
  text.textContent = t;
  text.classList.remove('warning', 'danger');

  if (t <= 5) {
    circle.classList.add('danger');
    text.classList.add('danger');
  } else if (t <= 10) {
    circle.classList.add('warning');
    text.classList.add('warning');
  }
}

/* ============================================================
   Submit Answer
   ============================================================ */
function submitAnswer() {
  if (state.isSubmitted) return;
  state.isSubmitted = true;
  clearInterval(state.timerInterval);

  $('#btnSubmit').disabled = true;
  $('#btnSubmit').textContent = '已提交';

  showAnswerFeedback();
  setTimeout(() => {
    renderResultPage();
    showPage('result');
  }, 1500);
}

function showAnswerFeedback() {
  const q = state.currentQuestion;
  const type = state.currentType;
  let correctSet;
  if (type === 'judge') {
    correctSet = q.answer === true ? [0] : [1];
  } else if (type === 'single') {
    correctSet = [q.answer];
  } else {
    correctSet = [...q.answer];
  }

  const optCount = type === 'judge' ? 2 : q.options.length;
  for (let i = 0; i < optCount; i++) {
    const el = $(`#opt-${i}`);
    if (!el) continue;
    el.classList.add('disabled');
    el.classList.remove('selected');
    if (correctSet.includes(i)) {
      el.classList.add('correct');
    }
    if (state.selectedOptions.includes(i) && !correctSet.includes(i)) {
      el.classList.add('wrong');
    }
  }
}

/* ============================================================
   Result Page (Page 4)
   ============================================================ */
function renderResultPage() {
  const q = state.currentQuestion;
  const type = state.currentType;
  const cfg = TYPE_CONFIG[type];
  const isCorrect = checkCorrect();

  const box = $('#resultAnswerBox');
  box.className = `result-answer-box ${isCorrect ? 'correct' : 'wrong'}`;

  const icon = $('#resultIcon');
  icon.className = `result-icon ${isCorrect ? 'correct' : 'wrong'}`;
  icon.innerHTML = isCorrect
    ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>'
    : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  $('#resultLabel').textContent = isCorrect ? '回答正确' : '回答错误';
  $('#resultScorePreview').textContent = `基础分：${isCorrect ? '+' : '-'}${cfg.score}分`;

  $('#resultQuestionText').textContent = q.q;

  let correctStr;
  if (type === 'judge') {
    correctStr = q.answer ? '正确' : '错误';
  } else if (type === 'single') {
    correctStr = String.fromCharCode(65 + q.answer);
  } else {
    correctStr = q.answer.map(i => String.fromCharCode(65 + i)).join('');
  }
  $('#resultCorrectAnswer').textContent = `正确答案：${correctStr}`;

  let yourStr;
  if (state.selectedOptions.length === 0) {
    yourStr = '未作答';
  } else if (type === 'judge') {
    yourStr = state.selectedOptions[0] === 0 ? '正确' : '错误';
  } else {
    yourStr = state.selectedOptions.sort().map(i => String.fromCharCode(65 + i)).join('');
  }
  const yourEl = $('#resultYourAnswer');
  yourEl.textContent = `你的答案：${yourStr}`;
  yourEl.className = `result-your-answer ${isCorrect ? 'correct' : 'wrong'}`;

  state.otherTeamResults = {};
  const grid = $('#otherTeamsGrid');
  const otherTeams = state.teams.filter((_, i) => i !== state.currentTeamIdx);
  grid.innerHTML = otherTeams.map(t => `
    <div class="other-team-item ot-unset" id="ot-${t.id}" onclick="toggleOtherTeam(${t.id})">
      <span class="ot-dot" style="background:${t.color}"></span>
      <span class="ot-name">${t.name}</span>
      <span class="ot-status">未设置</span>
    </div>
  `).join('');

  $('#scoreBreakdown').style.display = 'none';
  $('#btnSettle').classList.remove('hidden');
  $('#btnNext').classList.add('hidden');
  state.settled = false;
}

function checkCorrect() {
  const q = state.currentQuestion;
  const type = state.currentType;
  const sel = [...state.selectedOptions].sort();

  if (type === 'judge') {
    const correctIdx = q.answer ? 0 : 1;
    return sel.length === 1 && sel[0] === correctIdx;
  }
  if (type === 'single') {
    return sel.length === 1 && sel[0] === q.answer;
  }
  const correct = [...q.answer].sort();
  return sel.length === correct.length && sel.every((v, i) => v === correct[i]);
}

function toggleOtherTeam(teamId) {
  if (state.settled) return;
  const current = state.otherTeamResults[teamId];
  if (current === undefined) {
    state.otherTeamResults[teamId] = true;
  } else if (current === true) {
    state.otherTeamResults[teamId] = false;
  } else {
    state.otherTeamResults[teamId] = undefined;
    delete state.otherTeamResults[teamId];
  }

  const el = $(`#ot-${teamId}`);
  if (!el) return;
  el.classList.remove('ot-correct', 'ot-wrong', 'ot-unset');
  const status = el.querySelector('.ot-status');
  const val = state.otherTeamResults[teamId];
  if (val === true) {
    el.classList.add('ot-correct');
    status.textContent = '答对';
  } else if (val === false) {
    el.classList.add('ot-wrong');
    status.textContent = '答错';
  } else {
    el.classList.add('ot-unset');
    status.textContent = '未设置';
  }
}

/* ============================================================
   Score Settlement
   ============================================================ */
function settleScore() {
  if (state.settled) return;
  state.settled = true;

  const isCorrect = checkCorrect();
  const type = state.currentType;
  const baseScore = TYPE_CONFIG[type].score;
  const otherTeams = state.teams.filter((_, i) => i !== state.currentTeamIdx);

  let otherCorrect = 0;
  let otherWrong = 0;
  let otherUnset = 0;

  otherTeams.forEach(t => {
    const result = state.otherTeamResults[t.id];
    if (result === true) otherCorrect++;
    else if (result === false) otherWrong++;
    else otherUnset++;
  });

  let scoreChange;
  let breakdownHtml = '';
  if (isCorrect) {
    const bonus = otherWrong * 10;
    scoreChange = baseScore + bonus;
    breakdownHtml = `
      <div class="sb-line"><span>基础得分</span><span class="score-positive">+${baseScore}分</span></div>
      <div class="sb-line"><span>其他队伍答错 ${otherWrong} 支，额外加分</span><span class="score-positive">+${bonus}分</span></div>
      ${otherUnset > 0 ? `<div class="sb-line"><span style="color:var(--text-secondary)">未设置队伍：${otherUnset} 支（不计入计算）</span><span></span></div>` : ''}
      <div class="sb-line sb-total"><span>本轮得分</span><span class="score-positive">+${scoreChange}分</span></div>
    `;
  } else {
    const penalty = otherCorrect * 10;
    scoreChange = -(baseScore + penalty);
    breakdownHtml = `
      <div class="sb-line"><span>基础扣分</span><span class="score-negative">-${baseScore}分</span></div>
      <div class="sb-line"><span>其他队伍答对 ${otherCorrect} 支，额外扣分</span><span class="score-negative">-${penalty}分</span></div>
      ${otherUnset > 0 ? `<div class="sb-line"><span style="color:var(--text-secondary)">未设置队伍：${otherUnset} 支（不计入计算）</span><span></span></div>` : ''}
      <div class="sb-line sb-total"><span>本轮得分</span><span class="score-negative">${scoreChange}分</span></div>
    `;
  }

  const bd = $('#scoreBreakdown');
  bd.innerHTML = breakdownHtml;
  bd.style.display = 'block';

  state.teams[state.currentTeamIdx].score += scoreChange;

  $('#resultScorePreview').textContent = `本轮：${scoreChange >= 0 ? '+' : ''}${scoreChange}分`;
  $('#resultScorePreview').className = `result-score-change ${scoreChange >= 0 ? 'score-positive' : 'score-negative'}`;

  $('#btnSettle').classList.add('hidden');
  $('#btnNext').classList.remove('hidden');

  animateRankingUpdate();
}

/* ============================================================
   Next Round
   ============================================================ */
function nextRound() {
  renderTeamGrid();
  renderRanking();
  showPage('teamSelect');
}

function backToTeamSelect() {
  state.currentTeamIdx = -1;
  renderTeamGrid();
  renderRanking();
  showPage('teamSelect');
}

function backToTypeSelect() {
  renderTypeGrid();
  showPage('typeSelect');
}

/* ============================================================
   Sidebar Ranking
   ============================================================ */
function renderRanking() {
  const sorted = [...state.teams].sort((a, b) => b.score - a.score);
  const list = $('#rankingList');
  list.innerHTML = sorted.map((t, i) => {
    const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : 'normal';
    const activeClass = t.id === state.currentTeamIdx ? 'active-team' : '';
    return `
      <div class="rank-item ${activeClass}" data-team-id="${t.id}" style="order:${i}">
        <div class="rank-num ${rankClass}">${i + 1}</div>
        <div class="rank-avatar" style="background:${t.color}">${t.abbr}</div>
        <div class="rank-name">${t.name}</div>
        <div class="rank-score">${t.score}</div>
        <div class="rank-change"></div>
      </div>
    `;
  }).join('');
}

function animateRankingUpdate() {
  const list = $('#rankingList');
  const items = list.querySelectorAll('.rank-item');
  const oldPositions = {};
  items.forEach(item => {
    const id = parseInt(item.dataset.teamId);
    oldPositions[id] = item.getBoundingClientRect();
  });

  const oldRanks = {};
  items.forEach((item, i) => {
    oldRanks[parseInt(item.dataset.teamId)] = i;
  });

  renderRanking();

  const newItems = list.querySelectorAll('.rank-item');
  const newRanks = {};
  newItems.forEach((item, i) => {
    newRanks[parseInt(item.dataset.teamId)] = i;
  });

  newItems.forEach(item => {
    const id = parseInt(item.dataset.teamId);
    const oldRect = oldPositions[id];
    if (!oldRect) return;
    const newRect = item.getBoundingClientRect();
    const deltaY = oldRect.top - newRect.top;
    if (Math.abs(deltaY) > 1) {
      item.style.transform = `translateY(${deltaY}px)`;
      item.style.transition = 'none';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          item.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          item.style.transform = 'translateY(0)';
        });
      });
    }

    const oldRank = oldRanks[id];
    const newRank = newRanks[id];
    const change = item.querySelector('.rank-change');
    if (oldRank !== undefined && newRank !== undefined && oldRank !== newRank) {
      const diff = oldRank - newRank;
      change.textContent = diff > 0 ? `+${diff}` : `${diff}`;
      change.className = `rank-change show ${diff > 0 ? 'up' : 'down'}`;
      setTimeout(() => { change.classList.remove('show'); }, 3000);
    }
  });
}

/* ============================================================
   QR Code
   ============================================================ */
function initQRCode() {
  const container = $('#qrCode');
  try {
    if (typeof QRCode !== 'undefined') {
      container.innerHTML = '';
      new QRCode(container, {
        text: QR_URL,
        width: 128,
        height: 128,
        colorDark: '#e8ecf1',
        colorLight: '#0a0e27',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  } catch (e) {
    container.textContent = '二维码区域';
  }
}

/* ============================================================
   Initialize
   ============================================================ */
function init() {
  renderTeamGrid();
  renderRanking();
  initQRCode();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
    $('#btnFullscreen').textContent = '退出全屏';
  } else {
    document.exitFullscreen();
    $('#btnFullscreen').textContent = '全屏显示';
  }
}
document.addEventListener('fullscreenchange', () => {
  $('#btnFullscreen').textContent = document.fullscreenElement ? '退出全屏' : '全屏显示';
});

document.addEventListener('DOMContentLoaded', init);
</script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" async
  onload="initQRCode()" onerror="console.log('QRCode library not available')"></script>
</body>
